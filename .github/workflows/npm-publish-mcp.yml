name: Publish MCP Server to npm

on:
  workflow_run:
    workflows: ["Publish to npm"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: npm-publish-mcp
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Skip if triggered by workflow_run and parent failed
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4

      # 🔴lock 기반 캐싱을 쓰지 않는다 — `mcp/package-lock.json` 은 2026-09-09 부터
      #   추적되지 않는다(리포 공통 정책, `.gitignore`). `cache: npm` +
      #   `cache-dependency-path` 는 그 경로가 **체크아웃 시점에 존재해야** 하고, 없으면
      #   *"Some specified paths were not resolved, unable to cache dependencies"* 로
      #   **이 단계에서 죽는다.** 아래 Install 이 lock 을 «스스로 생성한 뒤» `npm ci` 를
      #   쓰지만, 그것은 이 단계보다 **뒤**다.
      #   ⚠마지막 성공 실행은 2026-09-08 — 추적 해제 «이전» 이라 아직 드러난 적이 없다.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Get package version
        id: pkg
        run: echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Check if version already published
        id: check
        run: |
          PACKAGE_NAME=$(node -p 'require("./package.json").name')
          VERSION=${{ steps.pkg.outputs.version }}
          if npm view "${PACKAGE_NAME}@${VERSION}" version 2>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "⏭️ ${PACKAGE_NAME}@${VERSION} already published, skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "🚀 ${PACKAGE_NAME}@${VERSION} not found on npm, will publish."
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install dependencies
        if: steps.check.outputs.exists == 'false'
        run: npm install --package-lock-only && npm ci

      - name: Build
        if: steps.check.outputs.exists == 'false'
        run: npm run build

      # ★신설(2026-09-10) — 이 스위트는 **어디에서도 돌지 않고 있었다.**
      #   부모의 vitest 는 `include: ['tests/**/*.{test,spec}.ts']` 라 `mcp/tests` 를 보지
      #   않고, 부모의 `ci.yml` 은 패키지 루트에서만 돈다. 그 사이에 `help(<exact>)` 가
      #   배열 → WidgetDetail 로 바뀌었는데 **아무것도 실패하지 않았다.**
      #   ⇒ 게시 직전이 이 스위트가 도는 유일한 자리다. 여기서 막지 않으면 검증된 적 없는
      #   코드를 게시한다.
      - name: Test
        if: steps.check.outputs.exists == 'false'
        run: npm test

      - name: Publish
        if: steps.check.outputs.exists == 'false'
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Summary
        run: |
          VERSION=${{ steps.pkg.outputs.version }}
          if [ "${{ steps.check.outputs.exists }}" == "true" ]; then
            echo "### ⏭️ Skipped — v${VERSION} already published" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ✅ Published @iyulab/u-widgets-mcp v${VERSION} to npm" >> "$GITHUB_STEP_SUMMARY"
          fi
