name: Deploy Demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # lock 파일이 없는 정책이므로(`ci.yml`·`npm-publish.yml` 과 같다) 자동 캐싱을 끈다 —
      # setup-node 의 lock 기반 캐싱은 lock-less 설치와 충돌한다.
      # 🔴이 스텝이 `npm ci` 였던 동안 커밋된 lock 이 매니페스트와 어긋나 배포가 죽었다
      # (lock 재생성으로 응급 복구했고, 구조적 원인은 lock 을 커밋하지 않는 정책으로 제거했다).
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install
      - run: npm run build:demo
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist-demo
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
